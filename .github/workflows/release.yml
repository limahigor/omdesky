name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.92.0
      - name: Build release binaries
        run: cargo build --release --locked --workspace
      - name: Package artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dist="omdesky-${version}-x86_64-linux"
          mkdir -p "$dist"
          cp target/release/omdesky "$dist/"
          cp target/release/omdesky-agent "$dist/"
          cp packaging/systemd/omdesky-agent.service "$dist/"
          cp scripts/install.sh "$dist/"
          cp LICENSE README.md "$dist/"
          tar --owner=0 --group=0 --numeric-owner -czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
      - name: Report the digest to pin in packaging
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          digest="$(cut -d' ' -f1 "omdesky-${version}-x86_64-linux.tar.gz.sha256")"
          {
            printf '## Pin this release in packaging\n\n'
            printf '```bash\nscripts/update-pkgbuild-sums.sh %s\n```\n\n' "$version"
            printf 'Expected `sha256sums=(%s)`\n' "'$digest'"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            omdesky-*-x86_64-linux.tar.gz
            omdesky-*-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            omdesky-*-x86_64-linux.tar.gz
            omdesky-*-x86_64-linux.tar.gz.sha256
          generate_release_notes: true
